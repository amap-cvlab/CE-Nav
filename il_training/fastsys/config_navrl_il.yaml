data:
  # Point these to your local IL dataset directories (containing .npz samples).
  train_dir: "./data/il_dataset/train_data"
  test_dir: "./data/il_dataset/test_data"
  batch_size: 1024
  num_workers: 8
  min_action: [-1.5, -1.5, -1.0]  # vx_min, vy_min, vyaw_min # 加载数据时会用这个参数做截断，需要与ppo.yaml配置保持相同
  max_action: [1.5, 1.5, 1.0]    # vx_max, vy_max, vyaw_max # 加载数据时会用这个参数做截断，需要与ppo.yaml配置保持相同


training:
  lr: 0.001
  epochs: 100
  log_interval: 100
  test_interval: 1000
  save_interval: 1
  save_dir: "./checkpoints"

wandb:
  use_wandb: True
  project: "navrl_il"
  entity:
  mode: offline # online
